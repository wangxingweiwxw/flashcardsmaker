<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {

.theme-purple { --word-color: #7b2cbf; --meaning-color: #c77dff; --pron-color: #9d4edd; --homo-color: #5a189a; --mem-color: #3c096c; --bg-1: #faf5ff; --bg-2: #f3e8ff; --card-bg: #ffffff; --btn-text: #7b2cbf; --accent: #7b2cbf; --shadow: 0 20px 60px rgba(123,44,191,0.15); }
.theme-midnight { --word-color: #a78bfa; --meaning-color: #f472b6; --pron-color: #818cf8; --homo-color: #c084fc; --mem-color: #e879f9; --bg-1: #0f0f23; --bg-2: #1a1a3e; --card-bg: #1e1e3a; --btn-bg: #2a2a4a; --btn-text: #c4b5fd; --accent: #a78bfa; --shadow: 0 20px 60px rgba(167,139,250,0.2); }
.theme-gold { --word-color: #b45309; --meaning-color: #f59e0b; --pron-color: #d97706; --homo-color: #fbbf24; --mem-color: #92400e; --bg-1: #fffbeb; --bg-2: #fef3c7; --card-bg: #ffffff; --btn-text: #b45309; --accent: #f59e0b; --shadow: 0 20px 60px rgba(245,158,11,0.15); }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    min-height: 100vh; min-height: 100dvh;
    color: var(--word-color); overflow: hidden; transition: background 0.5s ease;
}
.app {
    max-width: 480px; margin: 0 auto;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; position: relative;
}
.header { padding: 16px 20px 8px; display: flex; justify-content: space-between; align-items: center; }
.header-left { display: flex; align-items: center; gap: 10px; }

.progress-text { font-size: 13px; color: var(--word-color); opacity: 0.5; }
.btn-icon {
    width: 38px; height: 38px; border-radius: 12px; border: none;
    background: var(--card-bg); color: var(--word-color); font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;

}
.btn-icon:active { transform: scale(0.92); }
.theme-panel, .font-panel {

    box-shadow: 0 10px 40px rgba(0,0,0,0.15); z-index: 100;
    display: none; min-width: 180px;
}
.theme-panel.show, .font-panel.show { display: block; }
.panel-title { font-size: 13px; font-weight: 600; color: var(--word-color); margin-bottom: 10px; opacity: 0.7; }
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.theme-btn {
    padding: 10px 8px; border-radius: 10px; border: 2px solid transparent;
    background: var(--card-bg); font-size: 12px; cursor: pointer;
    text-align: center; transition: all 0.2s; color: var(--word-color); font-weight: 500;
}
.theme-btn:active { transform: scale(0.95); }
.theme-btn.active { border-color: var(--accent); background: var(--bg-2); }
.font-slider { width: 100%; margin: 8px 0; accent-color: var(--accent); }
.font-info { font-size: 12px; color: var(--word-color); opacity: 0.6; text-align: center; }
.card-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px; position: relative;
}
.word-card {
    width: 100%; background: var(--card-bg); border-radius: 24px;
    padding: 40px 30px; box-shadow: var(--shadow);
    text-align: center; animation: cardIn 0.4s ease;
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.word-main { font-size: calc(64px * var(--fs)); font-weight: 700; color: var(--word-color); margin-bottom: 8px; letter-spacing: -1px; transition: font-size 0.2s; }
.word-pron { font-size: calc(20px * var(--fs)); color: var(--pron-color); margin-bottom: 20px; }
.divider { height: 1px; background: var(--bg-2); margin: 16px 20px; border-radius: 1px; }
.word-meaning { font-size: calc(28px * var(--fs)); color: var(--meaning-color); font-weight: 600; margin-bottom: 20px; line-height: 1.4; transition: font-size 0.2s; }
.word-homo { font-size: calc(22px * var(--fs)); color: var(--homo-color); font-weight: 500; margin-bottom: 12px; transition: font-size 0.2s; }
.word-homo-label { font-size: 13px; color: var(--homo-color); opacity: 0.5; margin-bottom: 8px; }
.speak-btn {
    margin: 24px auto 0; width: 64px; height: 64px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff; font-size: 28px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(233,69,96,0.25); transition: all 0.2s;
    font-size: calc(26px * var(--fs));
}
.speak-btn:active { transform: scale(0.9); }
.speak-btn.playing { animation: speakPulse 0.8s ease infinite; }
@keyframes speakPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.progress-bar { position: absolute; top: 0; left: 0; height: 3px; background: var(--accent); border-radius: 0 3px 3px 0; transition: width 0.3s ease; z-index: 10; }
.bottom-nav {
    padding: 16px 20px 24px; display: flex; gap: 10px; align-items: center;
    background: var(--card-bg); border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
}
.nav-btn {
    flex: 1; padding: 14px 10px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.nav-btn:active { transform: scale(0.95); }
.btn-nav { background: var(--bg-2); color: var(--word-color); }
.btn-know { background: var(--accent); color: #fff; }
.btn-list { background: var(--bg-2); color: var(--word-color); width: 56px; flex: 0 0 56px; position: relative; }
.stats-badge {
    position: absolute; top: -6px; right: -6px;
    background: #22c55e; color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px; min-width: 22px; text-align: center;
}
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
    display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
    width: 100%; max-width: 480px; max-height: 75vh;
    background: var(--card-bg); border-radius: 24px 24px 0 0;
    padding: 24px 20px; animation: slideUp 0.3s ease; display: flex; flex-direction: column;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; }
.modal-title { font-size: 20px; font-weight: 700; color: var(--word-color); }
.modal-close { width: 32px; height: 32px; border-radius: 10px; border: none; background: var(--bg-2); color: var(--word-color); font-size: 16px; cursor: pointer; }
.known-stats { display: flex; gap: 12px; margin-bottom: 16px; flex-shrink: 0; }
.stat-card { flex: 1; background: var(--bg-2); border-radius: 14px; padding: 12px; text-align: center; }
.stat-num { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--word-color); opacity: 0.6; margin-top: 2px; }
.known-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.known-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--bg-2); border-radius: 12px; margin-bottom: 6px; }
.known-item-word { font-size: 18px; font-weight: 600; color: var(--word-color); }
.known-item-meaning { font-size: 14px; color: var(--meaning-color); opacity: 0.8; }
.known-item-undo { width: 32px; height: 32px; border-radius: 10px; border: none; background: transparent; color: var(--word-color); font-size: 16px; cursor: pointer; opacity: 0.5; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--word-color); opacity: 0.4; }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: var(--word-color); color: var(--card-bg); padding: 12px 24px;
    border-radius: 14px; font-size: 15px; font-weight: 500; z-index: 300;
    transition: transform 0.3s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
@media (max-height: 680px) {
    .word-card { padding: 28px 24px; }
    .word-main { font-size: clamp(40px, 10vw, 56px); }
    .word-meaning { font-size: clamp(20px, 5vw, 26px); }
}
@media (min-width: 481px) {
    .app { margin-top: 10px; height: calc(100vh - 20px); border-radius: 24px; overflow: hidden; }
}
.version-label {
    font-size: 11px; font-weight: 600; color: var(--word-color);
    background: var(--bg-2); padding: 3px 8px; border-radius: 6px;
    opacity: 0.5; letter-spacing: 0.5px;
}
.search-panel {
    position: fixed; inset: 0; background: var(--card-bg);
    z-index: 150; display: none; flex-direction: column;
    animation: slideUp 0.3s ease;
}
.search-panel.show { display: flex; }
.search-header {
    padding: 16px 20px 12px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--bg-2);
}
.search-close {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: var(--bg-2); color: var(--word-color); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.search-input {
    flex: 1; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--bg-2);
    font-size: 16px; background: var(--card-bg); color: var(--word-color);
    outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-body { flex: 1; overflow-y: auto; padding: 12px 20px 20px; }
.search-count {
    font-size: 13px; color: var(--word-color); opacity: 0.5;
    padding: 4px 0 12px;
}
.search-result-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-radius: 12px; background: var(--card-bg);
    margin-bottom: 8px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: all 0.15s;
}
.search-result-item:active { transform: scale(0.98); background: var(--bg-2); }
.search-result-word { font-size: 20px; font-weight: 700; color: var(--word-color); }
.search-result-info { flex: 1; margin: 0 12px; }
.search-result-pron { font-size: 13px; color: var(--pron-color); margin-bottom: 2px; }
.search-result-meaning { font-size: 14px; color: var(--meaning-color); margin-bottom: 2px; }

.word-highlight { background: rgba(233,69,96,0.2); border-radius: 2px; padding: 0 2px; }
</style>

var knownSet = new Set(JSON.parse(localStorage.getItem('wordApp_known') || '[]'));
var pool = [];
var currentIndex = -1;

function el(id) { return document.getElementById(id); }

function toast(msg) {
    var t = el('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show');}, 2000);
}

function shuffleArray(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
}

function buildPool() {
    pool = [];
    for (var i = 0; i < ALL_WORDS.length; i++) {
        if (!knownSet.has(ALL_WORDS[i].word)) pool.push(i);
    }
    shuffleArray(pool);
}

function showWord(idx) {
    if (pool.length === 0) {
        el('wordMain').textContent = '\u1f389';
        el('wordPron').textContent = '\u5168\u90e8\u5355\u8bcd\u5df2\u8bb0\u4f4f\uff01';
        el('wordMeaning').textContent = '';
        el('wordHomo').textContent = '';
        el('progressBar').style.width = '100%';
        el('progressText').textContent = '\u5b8c\u6210';
        return;
    }
    var w = ALL_WORDS[pool[idx]];
    el('wordMain').textContent = w.word;
    el('wordPron').textContent = w.pronunciation;
    el('wordMeaning').textContent = w.meaning;
    el('wordHomo').textContent = w.homophone;
    el('progressBar').style.width = ((idx + 1) / pool.length * 100) + '%';
    el('progressText').textContent = '\u5269\u4f59 ' + pool.length + ' \u4e2a';
    var card = el('wordCard');
    card.style.animation = 'none'; card.offsetHeight; card.style.animation = '';
}

function updateBadge() {
    var b = el('knownBadge');
    if (knownSet.size > 0) { b.style.display = 'block'; b.textContent = knownSet.size; }
    else { b.style.display = 'none'; }
}

function speak() {
    if (pool.length === 0) return;
    var w = ALL_WORDS[pool[currentIndex]];
    if (!w || !w.word) return;
    var btn = el('speakBtn');
    btn.classList.add('playing');
    try {
        var word = w.word.replace(/[^a-zA-Z\s]/g, '');
        if (!word) word = w.word;
        var url = 'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(word);
        var audio = new Audio(url);
        audio.play().then(function() {
            toast('正在朗读...');
        }).catch(function(e) {
            btn.classList.remove('playing');
            toast('朗读失败，请检查网络');
        });
        audio.onended = function() { btn.classList.remove('playing'); };
        audio.onerror = function() { btn.classList.remove('playing'); toast('朗读失败，请检查网络'); };
        setTimeout(function() {
            if (btn.classList.contains('playing')) {
                btn.classList.remove('playing');
            }
        }, 8000);
    } catch(e) {
        btn.classList.remove('playing');
        toast('朗读失败，请检查网络');
    }
}

function save() {
    localStorage.setItem('wordApp_known', JSON.stringify(Array.from(knownSet)));
    updateBadge();
}

function next() {
    if (pool.length === 0) { toast('\u5168\u90e8\u5df2\u8bb0\u4f4f\uff01'); return; }
    currentIndex++;
    if (currentIndex >= pool.length) { currentIndex = 0; shuffleArray(pool); }
    showWord(currentIndex);
}

function prev() {
    if (pool.length === 0) return;
    currentIndex--;
    if (currentIndex < 0) currentIndex = pool.length - 1;
    showWord(currentIndex);
}

function markKnown() {
    if (pool.length === 0) return;
    var w = ALL_WORDS[pool[currentIndex]];
    knownSet.add(w.word); save();
    toast('\u2705 "' + w.word + '" \u5df2\u8bb0\u4f4f');
    pool.splice(currentIndex, 1);
    if (currentIndex >= pool.length) currentIndex = pool.length > 0 ? 0 : -1;
    showWord(currentIndex);
}

function showKnownList() {
    var list = el('knownList');
    var kw = [];
    for (var i = 0; i < ALL_WORDS.length; i++) {
        if (knownSet.has(ALL_WORDS[i].word)) kw.push(ALL_WORDS[i]);
    }
    el('statKnown').textContent = kw.length;
    el('statRemaining').textContent = ALL_WORDS.length - kw.length;
    el('statPercent').textContent = Math.round(kw.length / ALL_WORDS.length * 100) + '%';
    if (kw.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">\u1f4d6</div><div>\u8fd8\u6ca1\u8bb0\u4f4f\u5355\u8bcd</div></div>';
    } else {
        var html = '';
        for (var k = 0; k < kw.length; k++) {
            var ww = kw[k];
            html += '<div class="known-item"><div><div class="known-item-word">' + ww.word + '</div><div class="known-item-meaning">' + ww.meaning + '</div></div><button class="known-item-undo" onclick="undoKnown(\'' + ww.word + '\')">&#x21a9;</button></div>';
        }
        list.innerHTML = html;
    }
    el('knownModal').classList.add('show');
}

function undoKnown(word) {
    knownSet.delete(word); save(); buildPool();
    currentIndex = -1; next(); showKnownList();
    toast('\u21a9 "' + word + '" \u5df2\u53d6\u6d88');
}

document.querySelectorAll('.theme-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.theme-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var theme = btn.dataset.theme;
        document.body.className = theme ? 'theme-' + theme : '';
        localStorage.setItem('wordApp_theme', theme || '');
        el('themePanel').classList.remove('show');
    });
});

var fontSlider = el('fontSlider');
var fontInfo = el('fontInfo');
fontSlider.addEventListener('input', function() {
    var v = parseFloat(fontSlider.value);
    fontInfo.textContent = Math.round(v * 100) + '%';
    document.documentElement.style.setProperty('--fs', v);
    localStorage.setItem('wordApp_font', v);
});

el('btnTheme').addEventListener('click', function() { el('themePanel').classList.toggle('show'); el('fontPanel').classList.remove('show'); });
el('btnFont').addEventListener('click', function() { el('fontPanel').classList.toggle('show'); el('themePanel').classList.remove('show'); });
document.addEventListener('click', function(e) {
    if (!el('themePanel').contains(e.target) && e.target !== el('btnTheme')) el('themePanel').classList.remove('show');
    if (!el('fontPanel').contains(e.target) && e.target !== el('btnFont')) el('fontPanel').classList.remove('show');
});
el('closeModal').addEventListener('click', function() { el('knownModal').classList.remove('show'); });
el('knownModal').addEventListener('click', function(e) { if (e.target === el('knownModal')) el('knownModal').classList.remove('show'); });
el('btnPrev').addEventListener('click', prev);
el('btnNext').addEventListener('click', next);
el('btnKnow').addEventListener('click', markKnown);
el('btnList').addEventListener('click', showKnownList);
el('speakBtn').addEventListener('click', speak);
document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'Enter') { markKnown(); }
});

function highlightText(text, keyword) {
    if (!keyword) return escapeHtml(text);
    var idx = text.toLowerCase().indexOf(keyword.toLowerCase());
    if (idx < 0) return escapeHtml(text);
    var before = escapeHtml(text.substring(0, idx));
    var match = escapeHtml(text.substring(idx, idx + keyword.length));
    var after = escapeHtml(text.substring(idx + keyword.length));
    return before + '<span class="word-highlight">' + match + '</span>' + after;
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openSearch() {
    el('searchPanel').classList.add('show');
    el('searchInput').value = '';
    el('searchResults').innerHTML = '';
    el('searchCount').textContent = '输入关键词开始搜索';
    setTimeout(function() { el('searchInput').focus(); }, 100);
}

function closeSearch() {
    el('searchPanel').classList.remove('show');
}

function doSearch(keyword) {
    keyword = keyword.trim();
    var results = [];
    if (keyword.length === 0) {
        el('searchCount').textContent = '输入关键词开始搜索';
        el('searchResults').innerHTML = '';
        return;
    }
    var kw = keyword.toLowerCase();
    for (var i = 0; i < ALL_WORDS.length; i++) {
        var w = ALL_WORDS[i];
        var wStr = (w.word || '') + ' ' + (w.meaning || '') + ' ' + (w.homophone || '');
        if (wStr.toLowerCase().indexOf(kw) >= 0) {
            results.push(w);
        }
    }
    var countEl = el('searchCount');
    var resEl = el('searchResults');
    if (results.length === 0) {
        countEl.textContent = '没有匹配到任何单词';
        resEl.innerHTML = '<div class="search-empty"><div class="search-empty-icon">&#x1f50d;</div><div class="search-empty-text">试试换个关键词搜索</div></div>';
        return;
    }
    countEl.textContent = '找到 ' + results.length + ' 个结果';
    var html = '';
    var maxShow = Math.min(results.length, 100);
    for (var k = 0; k < maxShow; k++) {
        var ww = results[k];
        html += '<div class="search-result-item" data-word="' + escapeHtml(ww.word) + '"><div class="search-result-word">' + highlightText(ww.word, keyword) + '</div>';
        html += '<div class="search-result-info"><div class="search-result-pron">' + escapeHtml(ww.pronunciation || '') + '</div>';
        html += '<div class="search-result-meaning">' + highlightText(ww.meaning, keyword) + '</div>';
        html += '<div class="search-result-homo">' + highlightText('谐音：' + ww.homophone, keyword) + '</div></div>';
        html += '<button class="search-result-speak" data-word="' + escapeHtml(ww.word) + '" data-idx="' + k + '" title="朗读">&#x1f50a;</button></div>';
    }
    resEl.innerHTML = html;
    if (results.length > 100) {
        resEl.innerHTML += '<div style="text-align:center;padding:16px;font-size:13px;color:var(--word-color);opacity:0.4;">已展示前100条，共 ' + results.length + ' 个结果</div>';
    }
    document.querySelectorAll('.search-result-speak').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            playWord(this.dataset.word);
        });
    });
    document.querySelectorAll('.search-result-item').forEach(function(item) {
        item.addEventListener('click', function() {
            goToWord(this.dataset.word);
        });
    });
}

function playWord(word) {
    var clean = word.replace(/[^a-zA-Z\s]/g, '');
    if (!clean) clean = word;
    var url = 'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(clean);
    try {
        var audio = new Audio(url);
        audio.play().catch(function(e) { toast('朗读失败，请检查网络'); });
    } catch(e) {
        toast('朗读失败，请检查网络');
    }
}

function goToWord(word) {
    closeSearch();
    var foundIdx = -1;
    for (var i = 0; i < ALL_WORDS.length; i++) {
        if (ALL_WORDS[i].word === word) { foundIdx = i; break; }
    }
    if (foundIdx < 0) return;
    var poolPos = -1;
    for (var j = 0; j < pool.length; j++) {
        if (pool[j] === foundIdx) { poolPos = j; break; }
    }
    if (poolPos >= 0) {
        currentIndex = poolPos;
        showWord(currentIndex);
    } else {
        pool.unshift(foundIdx);
        currentIndex = 0;
        showWord(currentIndex);
    }
}

// ── Search Panel ──
el('btnSearch').addEventListener('click', openSearch);
el('searchClose').addEventListener('click', closeSearch);
el('searchInput').addEventListener('input', function() {
    doSearch(this.value);
});
el('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeSearch();
});

buildPool(); currentIndex = -1; next();
var st = localStorage.getItem('wordApp_theme') || '';
if (st) { document.body.className = 'theme-' + st; document.querySelectorAll('.theme-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.theme === st); }); }
var sf = localStorage.getItem('wordApp_font');
if (sf) { fontSlider.value = sf; fontInfo.textContent = Math.round(sf * 100) + '%'; }
console.log('Loaded ' + ALL_WORDS.length + ' words');
</script>
